name: Validate JSON

on:
  pull_request:
    paths:
      - "data/**/*.json"
      - "contract/schema.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Trust mise configs
        run: mise trust --all

      - name: Install tools for contract
        run: pip install frictionless

      - name: Validate JSON files
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base...HEAD" -- contract/schema.json; then
            files=$(git diff --name-only --diff-filter=AMR \
              "$base...HEAD" -- 'data/**/*.json')
          else
            files=$(git ls-files 'data/**/*.json')
          fi

          if [ -z "$files" ]; then
            echo "Aucun fichier JSON à valider."
            exit 0
          fi

          status=0
          while IFS= read -r f; do
            echo "::group::Validation de $f"
            if ! mise -C contract validate "$GITHUB_WORKSPACE/$f"; then
              echo "::error file=$f::Validation échouée"
              status=1
            fi
            echo "::endgroup::"
          done <<< "$files"

          exit $status