name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MISE_ENV: ci
  NITRO_PRESET: github_pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: --monorepo
      - run: mise run site-gouv-fr:build
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
      - run: mise run site-white-label:build
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/white-label/
      - run: |
          cp -R sites/gouv-fr/.output/public _site
          cp -R sites/white-label/.output/public _site/white-label
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
