name: Validate Table Schema

on:
  pull_request:
    paths:
      - 'contract/schema.json'

permissions:
  contents: read

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'
      - run: cd contract
      - run: pip install frictionless
      - run: mise validate_schema