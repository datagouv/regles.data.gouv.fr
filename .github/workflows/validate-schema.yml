name: Validate Table Schema

on:
  push:
    branches: [main]
    paths:
      - 'contract/schema.json'
  pull_request:
    paths:
      - 'contract/schema.json'

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise -C contract run validate_schema
