name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  MISE_ENV: ci

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          install_args: --monorepo
      - run: mise run test
      - run: mise run pack
      - name: Check that every archive carries the version of the tag
        run: |
          for archive in dist/*.tgz; do
            [[ "$archive" == *"-${GITHUB_REF_NAME#v}.tgz" ]] || { echo "::error::$archive does not carry the version ${GITHUB_REF_NAME#v}"; exit 1; }
          done
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
