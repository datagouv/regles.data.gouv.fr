name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  MISE_ENV: ci

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: --monorepo
      - run: mise run test
      - run: mise run pack
      - name: Check that every archive carries the version of the tag
        run: |
          for archive in dist/*.tgz; do
            [[ "$archive" == *"-${GITHUB_REF_NAME#v}.tgz" ]] || { echo "::error::$archive does not carry the version ${GITHUB_REF_NAME#v}"; exit 1; }
          done
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
