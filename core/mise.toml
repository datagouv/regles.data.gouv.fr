[tasks.generate]
alias = "core:generate"
description = "Generate the record JSON Schema, types and schema version from the contract schema"
depends = ["//:install"]
sources = ["../contract/schema.json", "scripts/generate.ts"]
outputs = ["src/generated/record.schema.json", "src/generated/record.ts", "src/generated/schema-version.ts", "src/generated/unique-fields.ts"]
run = "node scripts/generate.ts"

[tasks.lint]
alias = "core:lint"
description = "Type-check core"
depends = ["generate"]
run = "pnpm exec tsc --noEmit"

[tasks.test]
alias = "core:test"
description = "Test core"
depends = ["generate"]
run = "pnpm exec vitest run"

[tasks.build]
alias = "core:build"
description = "Compile core into dist/lib, the code of the archive"
depends = ["generate"]
run = ["rm -rf dist", "pnpm exec tsc -p tsconfig.build.json"]

[tasks.pack]
alias = "core:pack"
description = "Pack the compiled core into the dist/ folder of the repository root"
depends = ["build"]
run = 'pnpm pack --pack-destination "$MISE_MONOREPO_ROOT/dist"'
