[tasks.generate]
alias = "core:generate"
description = "Generate the record JSON Schema and types from the contract schema"
depends = ["//:install"]
sources = ["../contract/schema.json", "scripts/generate.ts"]
outputs = ["src/generated/record.schema.json", "src/generated/record.ts", "src/generated/unique-fields.ts"]
run = "node scripts/generate.ts"

[tasks.lint]
alias = "core:lint"
description = "Type-check core"
depends = ["generate"]
run = "pnpm exec tsc --noEmit"

[tasks.test]
alias = "core:test"
description = "Test core"
depends = ["generate"]
run = "pnpm exec vitest run"
