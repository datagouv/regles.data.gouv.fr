min_version = "2026.8.14"
monorepo_root = true

[monorepo]
config_roots = ["contract", "core", "engines/*", "web", "sites/*"]

[tools]
hk = "1"
node = "24"
pnpm = "12"

[settings]
lockfile = true

[tasks.install]
description = "Install the JavaScript dependencies of every package"
sources = ["package.json", "pnpm-lock.yaml", "*/package.json", "sites/*/package.json"]
outputs = ["node_modules/.modules.yaml"]
run = "pnpm install --frozen-lockfile"

[tasks.lint]
description = "Lint every package"
depends = ["//...:lint", "lint:code"]

[tasks."lint:code"]
description = "Lint the TypeScript and Vue code"
depends = ["install"]
run = "pnpm exec eslint ."

[tasks."lint:fix"]
description = "Lint the TypeScript and Vue code with autofix"
depends = ["install"]
run = "pnpm exec eslint . --fix"

[tasks."install:playwright"]
description = "Install the browser of the end-to-end tests"
depends = ["install"]
run = "pnpm exec playwright install chromium"

[tasks."test:e2e"]
description = "Test the accessibility of the generated sites in a browser"
depends = ["install:playwright", "build"]
run = "pnpm exec playwright test"

[tasks.test]
description = "Run the tests of every package"
wait_for = ["lint"]
depends = ["//...:test"]

[tasks.build]
description = "Build every package: compile core and generate every site"
depends = ["//...:build"]

[tasks.pack]
description = "Pack every published package into dist/, as the archives of a release"
depends = ["//...:pack"]

[tasks.check]
description = "Everything the CI checks: lint, tests and the build of every package"
depends = ["lint", "test", "build"]

[task_templates."nuxt:prepare"]
description = "Generate the Nuxt types"
depends = ["//:install", "//core:generate"]
run = "pnpm exec nuxt prepare"

[task_templates."nuxt:dev"]
description = "Serve the site in development"
depends = ["prepare"]
run = "pnpm exec nuxt dev"

[task_templates."nuxt:build"]
description = "Generate the static site into .output/public"
depends = ["prepare"]
# nuxt generate rewrites .nuxt, which nuxt typecheck reads
wait_for = ["//...:lint"]
run = "pnpm exec nuxt generate"

[task_templates."nuxt:lint"]
description = "Type-check the site"
depends = ["prepare"]
run = "pnpm exec nuxt typecheck"
