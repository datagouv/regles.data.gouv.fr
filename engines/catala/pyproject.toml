[project]
name = "engine-catala"
version = "0.1.0"
description = "Run the native Catala tests of the repositories cited by the records"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
engine-catala = "engine_catala:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
